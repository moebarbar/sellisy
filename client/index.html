<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Sellisy - Create & Sell Digital Products</title>
    <meta name="description" content="Build your digital storefront in minutes. Import products, accept payments, and deliver secure downloads. The easiest way to sell digital products online." />
    <meta property="og:title" content="Sellisy - Create & Sell Digital Products" />
    <meta property="og:description" content="Build your digital storefront in minutes. Import products, accept payments, and deliver secure downloads." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Hint the browser to start the TLS+TCP handshake to the Clerk auth
         domain in parallel with the rest of the page so the auth SDK
         loads faster on /auth. -->
    <link rel="preconnect" href="https://clerk.sellisy.com" crossorigin>
    <link rel="dns-prefetch" href="https://clerk.sellisy.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Core UI fonts: landing page, dashboard, storefront themes (display=optional prevents flash) -->
    <!-- Trimmed font set: dropped Permanent Marker (unused), italics, and
         narrowed variable axis to weights we actually use. ~60% smaller
         download than the previous URL. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=optional">
